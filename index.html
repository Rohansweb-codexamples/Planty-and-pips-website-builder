<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planty & Pips Website Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f8f6ef;
    overflow:hidden;
}

/* INTRO */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

#intro video{
    width:100%;
    height:100%;
    object-fit:cover;
}

#skip{
    position:absolute;
    right:20px;
    bottom:20px;
    background:#1f8f55;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

#skip:hover{
    background:#167443;
}

/* APP */

#app{
    display:none;
    height:100vh;
    grid-template-rows:75px 1fr;
}

/* TOP BAR */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:white;
    border-bottom:1px solid #ddd;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:24px;
    font-weight:700;
    color:#1f8f55;
}

.brand img{
    height:40px;
    width:40px;
    object-fit:contain;
}

.actions{
    display:flex;
    gap:10px;
}

.btn{
    border:none;
    cursor:pointer;
    padding:12px 18px;
    border-radius:14px;
    font-weight:600;
    font-size:14px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn:disabled{
    opacity:.6;
    cursor:wait;
    transform:none;
}

.publish{
    background:#1f8f55;
    color:white;
}

.publish:hover{
    background:#167443;
}

.preview{
    background:#eef8f1;
    color:#1f8f55;
}

/* MAIN */

.main{
    display:grid;
    grid-template-columns:260px 1fr 280px;
    height:calc(100vh - 75px);
}

/* LEFT SIDEBAR */

.sidebar{
    background:white;
    border-right:1px solid #ddd;
    padding:20px;
    overflow:auto;
}

.sidebar h3{
    margin-bottom:15px;
    color:#1f8f55;
}

.block{
    background:#f7faf8;
    padding:15px;
    margin-bottom:12px;
    border-radius:14px;
    cursor:pointer;
    border:2px solid transparent;
    transition:.2s;
}

.block:hover{
    border-color:#1f8f55;
    background:#eef8f1;
}

/* CANVAS */

.canvas{
    background:#d9e2ea;
    overflow:auto;
    padding:30px;
}

.page{
    background:white;
    width:100%;
    max-width:1000px;
    min-height:1200px;
    margin:auto;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

/* HERO */

.hero{
    height:350px;
    background:linear-gradient(135deg,#1f8f55,#6fcf97);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:50px;
    font-weight:700;
    text-align:center;
    padding:20px;
}

/* CONTENT */

.content{
    padding:30px;
}

.panel{
    background:white;
    border-left:1px solid #ddd;
    padding:20px;
}

.panel h3{
    color:#1f8f55;
    margin-bottom:15px;
}

.page-item{
    padding:12px;
    border-radius:12px;
    background:#f7faf8;
    margin-bottom:10px;
}

.element{
    padding:15px;
    margin:15px;
    border:2px dashed #d7d7d7;
    border-radius:12px;
    cursor:pointer;
}

.element:hover{
    border-color:#1f8f55;
}

/* BUTTON BLOCK */

.content button.element{
    background:#1f8f55;
    color:white;
    border:0;
    padding:13px 22px;
    cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:900px){

    .main{
        grid-template-columns:210px 1fr;
    }

    .panel{
        display:none;
    }

    .brand{
        font-size:18px;
    }

    .brand img{
        height:32px;
        width:32px;
    }
}

@media(max-width:600px){

    .main{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:none;
    }

    .topbar{
        padding:0 10px;
    }

    .brand{
        font-size:16px;
        gap:6px;
    }

    .actions{
        gap:5px;
    }

    .btn{
        padding:10px 12px;
    }

    .canvas{
        padding:10px;
    }

    .hero{
        height:250px;
        font-size:34px;
    }
}
</style>

</head>

<body>

<!-- INTRO -->

<div id="intro">

```
<video autoplay muted playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<button id="skip">
    Start Building
</button>
```

</div>

<!-- APP -->

<div id="app">

```
<!-- TOP BAR -->

<div class="topbar">

    <div class="brand">

        <img src="planty.png" alt="Planty">

        <span>Planty & Pips Builder</span>

        <img src="pip.png" alt="Pips">

    </div>


    <div class="actions">

        <button
            class="btn preview"
            onclick="previewSite()">
            Preview
        </button>

        <button
            class="btn publish"
            onclick="publishSite()">
            Publish
        </button>

    </div>

</div>


<!-- MAIN -->

<div class="main">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h3>Blocks</h3>

        <div
            class="block"
            onclick="addHeading()">
            Heading
        </div>

        <div
            class="block"
            onclick="addText()">
            Text
        </div>

        <div
            class="block"
            onclick="addButton()">
            Button
        </div>

        <div
            class="block"
            onclick="addImage()">
            Image
        </div>

    </div>


    <!-- CANVAS -->

    <div class="canvas">

        <div
            class="page"
            id="page">

            <div
                class="hero"
                contenteditable="true">

                My Website

            </div>


            <div
                class="content"
                id="content">

                <div
                    class="element"
                    contenteditable="true">

                    Click blocks on the left to build your site.

                </div>

            </div>

        </div>

    </div>


    <!-- RIGHT PANEL -->

    <div class="panel">

        <h3>Pages</h3>

        <div class="page-item">
            Home
        </div>

        <button
            class="btn publish"
            style="width:100%;margin-top:10px;"
            onclick="newPage()">

            New Page

        </button>

    </div>

</div>
```

</div>

<script>

/* =========================
   INTRO
========================= */

const intro = document.getElementById("intro");
const app = document.getElementById("app");

function startBuilder(){

    intro.style.display = "none";

    app.style.display = "grid";

}

document.getElementById("skip").onclick = startBuilder;

setTimeout(startBuilder,7000);


/* =========================
   CONTENT
========================= */

const content = document.getElementById("content");


/* HEADING */

function addHeading(){

    const h = document.createElement("h1");

    h.className = "element";

    h.contentEditable = true;

    h.innerText = "New Heading";

    content.appendChild(h);

    saveProject();

}


/* TEXT */

function addText(){

    const p = document.createElement("p");

    p.className = "element";

    p.contentEditable = true;

    p.innerText = "New text block";

    content.appendChild(p);

    saveProject();

}


/* BUTTON */

function addButton(){

    const b = document.createElement("button");

    b.className = "element";

    b.innerText = "Button";

    b.type = "button";

    b.onclick = function(){

        alert("This is your website button.");

    };

    content.appendChild(b);

    saveProject();

}


/* IMAGE */

function addImage(){

    const url = prompt("Enter image URL");

    if(!url) return;

    const img = document.createElement("img");

    img.src = url;

    img.className = "element";

    img.style.maxWidth = "100%";

    img.style.display = "block";

    content.appendChild(img);

    saveProject();

}


/* =========================
   SAVE
========================= */

function saveProject(){

    localStorage.setItem(
        "plantySite",
        document.getElementById("page").innerHTML
    );

}


/* =========================
   LOAD
========================= */

window.addEventListener("load",()=>{

    const saved = localStorage.getItem("plantySite");

    if(saved){

        document.getElementById("page").innerHTML = saved;

    }

});


/* =========================
   PREVIEW
========================= */

function previewSite(){

    const html =
        document.getElementById("page").innerHTML;

    const previewWindow =
        window.open("", "_blank");

    if(!previewWindow){

        alert("Please allow pop-ups to preview your site.");

        return;

    }

    previewWindow.document.open();

    previewWindow.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planty & Pips Website</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Poppins,Arial,sans-serif;
background:#f8f6ef;
}

img{
max-width:100%;
}

.element{
border:0 !important;
cursor:default !important;
}

</style>

</head>

<body>

${html}

</body>

</html>
`);

```
previewWindow.document.close();
```

}

/* =========================
NEW PAGE
========================= */

function newPage(){

```
if(!confirm("Create a new blank page?")){

    return;

}

document.getElementById("page").innerHTML = `

    <div
        class="hero"
        contenteditable="true">

        New Page

    </div>

    <div
        class="content"
        id="content">

        <div
            class="element"
            contenteditable="true">

            Start building this page.

        </div>

    </div>

`;

localStorage.removeItem("plantySite");
```

}

/* =========================
PUBLISH
========================= */

async function publishSite(){

```
const button =
    document.querySelector(".publish");

const originalText =
    button.innerText;

try{

    button.innerText = "Publishing...";

    button.disabled = true;


    /* Get the website HTML */

    const html =
        document.getElementById("page").innerHTML;


    /* Send to Render */

    const response = await fetch(

        "https://planty-and-pips-website-builder.onrender.com/publish",

        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                html:html

            })

        }

    );


    if(!response.ok){

        throw new Error(
            "Server returned HTTP " +
            response.status
        );

    }


    const result =
        await response.json();


    /* SUCCESS */

    if(result.success){

        alert(

            "Published!\n\n" +
            result.url

        );


        if(result.url){

            window.open(
                result.url,
                "_blank"
            );

        }

    }

    /* ERROR FROM SERVER */

    else{

        alert(

            "Publish failed\n\n" +

            (
                result.error ||
                "The server could not publish your website."
            )

        );

    }

}

catch(error){

    console.error(
        "Publish error:",
        error
    );

    alert(

        "Publish failed\n\n" +

        "Could not connect to the Planty & Pips publishing server."

    );

}

finally{

    button.innerText =
        originalText;

    button.disabled =
        false;

}
```

}

/* =========================
AUTO SAVE
========================= */

document.addEventListener(
"input",
function(){

```
    saveProject();

}
```

);

</script>

</body>
</html>
