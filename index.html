<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planty & Pips Website Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f8f6ef;
overflow:hidden;
}

#intro{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
background:#000;
}

#intro video{
width:100%;
height:100%;
object-fit:cover;
}

#skip{
position:absolute;
right:20px;
bottom:20px;
background:#1f8f55;
color:white;
border:none;
padding:12px 20px;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

#app{
display:none;
height:100vh;
grid-template-rows:75px 1fr;
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:white;
border-bottom:1px solid #ddd;
}

.brand{
display:flex;
align-items:center;
gap:12px;
font-size:24px;
font-weight:700;
color:#1f8f55;
}

.brand img{
height:40px;
}

.actions{
display:flex;
gap:10px;
}

.btn{
border:none;
cursor:pointer;
padding:12px 18px;
border-radius:14px;
font-weight:600;
}

.publish{
background:#1f8f55;
color:white;
}

.preview{
background:#eef8f1;
color:#1f8f55;
}

.main{
display:grid;
grid-template-columns:260px 1fr 280px;
height:calc(100vh - 75px);
}

.sidebar{
background:white;
border-right:1px solid #ddd;
padding:20px;
overflow:auto;
}

.sidebar h3{
margin-bottom:15px;
color:#1f8f55;
}

.block{
background:#f7faf8;
padding:15px;
margin-bottom:12px;
border-radius:14px;
cursor:pointer;
border:2px solid transparent;
}

.block:hover{
border-color:#1f8f55;
}

.canvas{
background:#d9e2ea;
overflow:auto;
padding:30px;
}

.page{
background:white;
width:100%;
max-width:1000px;
min-height:1200px;
margin:auto;
box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.hero{
height:350px;
background:linear-gradient(135deg,#1f8f55,#6fcf97);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:50px;
font-weight:700;
}

.content{
padding:30px;
}

.panel{
background:white;
border-left:1px solid #ddd;
padding:20px;
}

.panel h3{
color:#1f8f55;
margin-bottom:15px;
}

.page-item{
padding:12px;
border-radius:12px;
background:#f7faf8;
margin-bottom:10px;
}

.element{
padding:15px;
margin:15px;
border:2px dashed #d7d7d7;
border-radius:12px;
cursor:pointer;
}

.element:hover{
border-color:#1f8f55;
}
</style>
</head>

<body>

<div id="intro">
<video autoplay muted playsinline>
<source src="video.mp4" type="video/mp4">
</video>

<button id="skip">Start Building</button>
</div>

<div id="app">

<div class="topbar">

<div class="brand">
<img src="planty.png">
Planty & Pips Builder
<img src="pip.png">
</div>

<div class="actions">
<button class="btn preview">Preview</button>
<button class="btn publish" onclick="publishSite()">Publish</button>
</div>

</div>

<div class="main">

<div class="sidebar">

<h3>Blocks</h3>

<div class="block" onclick="addHeading()">Heading</div>

<div class="block" onclick="addText()">Text</div>

<div class="block" onclick="addButton()">Button</div>

<div class="block" onclick="addImage()">Image</div>

</div>

<div class="canvas">

<div class="page" id="page">

<div class="hero">
My Website
</div>

<div class="content" id="content">

<div class="element">
Click blocks on the left to build your site.
</div>

</div>

</div>

</div>

<div class="panel">

<h3>Pages</h3>

<div class="page-item">Home</div>

<button class="btn publish" style="width:100%;margin-top:10px;">
New Page
</button>

</div>

</div>

</div>

<script>

const intro=document.getElementById("intro");
const app=document.getElementById("app");

document.getElementById("skip").onclick=()=>{
intro.style.display="none";
app.style.display="grid";
};

setTimeout(()=>{
intro.style.display="none";
app.style.display="grid";
},7000);

const content=document.getElementById("content");

function addHeading(){
const h=document.createElement("h1");
h.className="element";
h.contentEditable=true;
h.innerText="New Heading";
content.appendChild(h);
saveProject();
}

function addText(){
const p=document.createElement("p");
p.className="element";
p.contentEditable=true;
p.innerText="New text block";
content.appendChild(p);
saveProject();
}

function addButton(){
const b=document.createElement("button");
b.className="element";
b.innerText="Button";
content.appendChild(b);
saveProject();
}

function addImage(){
const url=prompt("Image URL");
if(!url)return;

const img=document.createElement("img");
img.src=url;
img.className="element";
img.style.maxWidth="100%";
content.appendChild(img);
saveProject();
}

function saveProject(){
localStorage.setItem(
"plantySite",
document.getElementById("page").innerHTML
);
}

window.onload=()=>{
const saved=localStorage.getItem("plantySite");
if(saved){
document.getElementById("page").innerHTML=saved;
}
}

function publishSite(){

const siteId=
"g_"+Math.random().toString(36).substring(2,12);

localStorage.setItem(
"published_"+siteId,
document.getElementById("page").innerHTML
);

alert(
"Published!\n\nhttps://projects.rohansweb.co.uk/Sites?siteId="+siteId
);

}

</script>

</body>
</html>
